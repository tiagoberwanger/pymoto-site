<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pymoto.dev.br</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #1e3a5f;
            color: #ffde57;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            text-align: center;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 24px;
            font-weight: 500;
            letter-spacing: 1px;

        .qrcode {

        }
        img {
            display: block;
            width: 180px;
            height: 180px;

    <div class="qrcode">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=https://t.me/+Y1k8l8AJfyZkMTVh" alt="QR Code Telegram">

</html>
